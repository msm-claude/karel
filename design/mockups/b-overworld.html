<!doctype html><html lang="sk"><head><meta charset="utf-8"><title>Karel — B: Nadzemie</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212b;--panel:#ffffff;--line:#17212b;--dim:#5b6b7a;--grass:#5cb531;--red:#e8562a;--sky1:#a9d8ff;--sky2:#eef7ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:linear-gradient(var(--sky1),var(--sky2) 70%);color:var(--ink);font:15px/1.4 "Chakra Petch",sans-serif}
.top{height:60px;display:flex;align-items:center;padding:0 24px;gap:20px}
.brand{font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:lowercase}
.brand i{display:inline-block;width:18px;height:18px;background:var(--grass);border:2px solid var(--ink);margin-right:10px;vertical-align:-2px;box-shadow:3px 3px 0 var(--ink)}
.room{font-size:15px;color:var(--dim)}
.sp{flex:1}
.pill{border:2px solid var(--ink);background:#fff;padding:7px 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.lang{display:flex;border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink)}
.lang span{padding:7px 12px;font-weight:700;color:var(--dim)}.lang .on{background:var(--ink);color:#fff}
.main{display:grid;grid-template-columns:1fr 520px;gap:20px;padding:8px 24px 24px;height:calc(100% - 60px)}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.world{flex:1;position:relative;border:2px solid var(--ink);background:rgba(255,255,255,.35);box-shadow:4px 4px 0 var(--ink)}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:14px;top:12px;font-weight:700}
.hud small{display:block;font-weight:500;color:var(--dim)}
.rot{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.rot span{width:40px;height:40px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:18px;box-shadow:3px 3px 0 var(--ink)}
.hotbar{display:flex;gap:10px;justify-content:center}
.slot{width:112px;height:68px;border:2px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;gap:4px}
.slot small{font-weight:500;color:var(--dim);font-size:12px}
.slot.run{background:var(--grass);color:#fff}.slot.run small{color:#e8ffd8}
.slot.wide{width:170px}
.bar{width:120px;height:8px;border:2px solid var(--ink);background:#fff;position:relative}.bar:after{content:"";position:absolute;left:0;top:0;bottom:0;width:60%;background:var(--red)}
.right{display:flex;flex-direction:column;border:2px solid var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--ink);min-height:0}
.tabs{display:flex;border-bottom:2px solid var(--ink)}
.tabs span{padding:10px 16px;font-weight:700;color:var(--dim)}.tabs .on{background:var(--ink);color:#fff}
.ed{flex:1;overflow:hidden;font:15px/1.65 "Fira Code",monospace;padding:12px 0}
.ln{display:flex}.ln .n{width:48px;text-align:right;padding-right:14px;color:#aab6c2;user-select:none}
.ln.active{background:#fff1ea;box-shadow:inset 4px 0 var(--red)}
.kw{color:#7a3fd1;font-weight:600}.cmd{color:#1f7a3e}.pred{color:#b3541e}.num{color:#17212b;font-weight:600}
.foot{border-top:2px solid var(--ink);padding:10px 16px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
</style></head><body>
<div class="top"><div class="brand"><i></i>Karel</div><span class="room">miestnosť: schody a múr</span><div class="sp"></div>
<div class="lang"><span class="on">SK</span><span>CZ</span><span>EN</span></div><button class="pill">Zdieľať odkaz</button></div>
<div class="main">
 <div class="stage">
  <div class="world"><div class="hud">Karel 3, 6 → východ<small>kroky 27, pohľad zo severovýchodu</small></div>
   <div class="rot"><span>↺</span><span>↻</span></div><canvas id="cv"></canvas></div>
  <div class="hotbar">
   <div class="slot run">Spusti<small>F5</small></div><div class="slot">Krok<small>F10</small></div><div class="slot">Zastav<small>Esc</small></div>
   <div class="slot wide">Rýchlosť<div class="bar"></div></div><div class="slot">Reset<small>miestnosť</small></div>
  </div>
 </div>
 <div class="right"><div class="tabs"><span class="on">Program</span><span>Miestnosť</span><span>Príkazy</span></div>
  <div class="ed" id="ed"></div><div class="foot"><span>beží: domov, riadok 14</span><span>uložené</span></div></div>
</div>
<script src="iso.js"></script><script src="editor.js"></script>
<script>
KarelEditor.mountEditor(document.getElementById('ed'),{activeLine:14});
document.fonts.ready.then(()=>KarelIso.renderWorld(document.getElementById('cv'),{view:0,maxTile:52,outline:'rgba(23,33,43,.6)',palette:{
 floorTop:'#5cb531',floorLeft:'#6e4526',floorRight:'#8a5a33',
 brickTop:'#a6a6a6',brickLeft:'#6a6a6a',brickRight:'#868686',
 mark:'#ffd23f',markInner:'#fff0a8',pit:'#2a1c10',plate:'rgba(23,33,43,.18)',
 karelTop:'#ff7a4a',karelLeft:'#b53c17',karelRight:'#e8562a',karelDark:'#2b2b2b',visor:'#17212b'}}));
</script></body></html>
