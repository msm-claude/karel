<!doctype html><html lang="sk"><head><meta charset="utf-8"><title>Karel — D: Výkres</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--grid:#dfe5ec;--ink:#1f3a5f;--dim:#6a7d95;--rule:#1f3a5f;--mark:#f0c419}
*{box-sizing:border-box;margin:0}
html,body{height:100%;color:var(--ink);font:16px/1.4 "Archivo Narrow",sans-serif;
 background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.top{display:flex;align-items:baseline;gap:18px;padding:22px 32px 12px;border-bottom:2px solid var(--rule);margin:0 32px}
.brand{font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase}
.room{color:var(--dim);font-size:17px}.sp{flex:1}
.top a{color:var(--ink);text-decoration:underline;text-underline-offset:4px;margin-left:18px;font-weight:600}
.top .lang{color:var(--dim)}.top .lang b{color:var(--ink)}
.main{display:grid;grid-template-columns:440px 1fr;gap:32px;padding:16px 32px 28px;height:calc(100% - 78px)}
.left{display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:24px}
.h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px}
.h b{font-size:18px}.h span{color:var(--dim)}
.ed{flex:1;overflow:hidden;font:15px/1.7 "Courier Prime",monospace;background:rgba(255,255,255,.7);border:1px solid var(--rule);padding:10px 0}
.ln{display:flex}.ln .n{width:44px;text-align:right;padding-right:12px;color:#9fb0c4;user-select:none}
.ln.active{background:#fff3c4}
.kw{font-weight:700}.cmd{color:#0f6b3a}.pred{color:#a3520f}.num{font-weight:700}
.ctl{display:flex;gap:22px;padding-top:12px;font-weight:600;align-items:center}
.ctl a{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.ctl .run{background:var(--ink);color:#fff;padding:6px 16px;text-decoration:none}
.ctl .sl{margin-left:auto;color:var(--dim);font-weight:400}
.right{position:relative;display:flex;flex-direction:column}
canvas{flex:1;width:100%;height:100%;display:block}
.cap{display:flex;gap:32px;padding-top:8px;border-top:1px solid var(--rule);color:var(--dim)}
.cap b{color:var(--ink)}
.rot{position:absolute;right:0;top:0;display:flex;gap:14px;font-weight:600}
.rot a{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.fig{position:absolute;left:0;top:0;color:var(--dim)}
</style></head><body>
<div class="top"><span class="brand">Karel</span><span class="room">Schody a múr, 10 × 8</span><span class="sp"></span>
<span class="lang"><b>slovensky</b> · česky · english</span><a href="#">Odkaz na miestnosť</a></div>
<div class="main">
 <div class="left"><div class="h"><b>Program</b><span>beží: domov, riadok 14</span></div><div class="ed" id="ed"></div>
  <div class="ctl"><a class="run" href="#">Spusti</a><a href="#">Krok</a><a href="#">Zastav</a><span class="sl">rýchlosť 3 z 5</span></div></div>
 <div class="right"><span class="fig">Obr. 1, pohľad zo severovýchodu</span><div class="rot"><a href="#">Otoč vľavo</a><a href="#">Otoč vpravo</a></div>
  <canvas id="cv"></canvas>
  <div class="cap"><span>Karel <b>3, 6</b>, smer <b>východ</b></span><span>kroky <b>27</b></span><span>značky <b>5</b></span></div></div>
</div>
<script src="iso.js"></script><script src="editor.js"></script>
<script>
KarelEditor.mountEditor(document.getElementById('ed'),{activeLine:14});
document.fonts.ready.then(()=>KarelIso.renderWorld(document.getElementById('cv'),{view:0,maxTile:50,texture:false,outline:'#1f3a5f',palette:{
 floorTop:'#ffffff',floorLeft:'#cfd9e4',floorRight:'#e4ebf2',
 brickTop:'#b9cee6',brickLeft:'#7f9dbf',brickRight:'#9ab4d2',
 mark:'#f0c419',markEdge:'#1f3a5f',pit:'#c9d3de',plate:null,
 karelTop:'#3d5f8a',karelLeft:'#16283f',karelRight:'#1f3a5f',karelDark:'#16283f',visor:'#ffffff'}}));
</script></body></html>
