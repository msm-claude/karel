<!doctype html><meta charset="utf-8"><title>Karel: blokový človiečik, tri varianty</title>
<style>
body{font:14px system-ui;background:#cfe6f5;margin:20px;color:#17212b}
.grid{display:grid;grid-template-columns:150px repeat(4,1fr);gap:14px;align-items:center}
.grid>div{background:#e9f3fa;padding:8px;border:1px solid #9bb}
.grid>.lbl{background:none;border:0;font-weight:600;line-height:1.35}
.grid>.lbl small{display:block;font-weight:400;color:#5b6b7a}
.hd{font-weight:600;text-align:center;background:none!important;border:0!important}
canvas{width:190px;height:118px;display:block;zoom:2.2}
</style>
<div class="grid" id="root"></div>
<script>
// Self-contained isometric sketch. Same projection and face noise as src/ui/render.ts, but Karel is
// built from six blocks in Steve proportions (head 8, torso 8x4x12, arms and legs 4x4x12; 32 units tall).
const W = 44, H = W / 2, FZ = W * 0.28, BZ = W * 0.31;
const U = W / 32; // one Karel "pixel" in px of height; a tile is 32 units wide too
const EDGE = 'rgba(23,33,43,.6)';
const FLOOR = ['#5cb531', '#6e4526', '#8a5a33'], BRICK = ['#a6a6a6', '#6a6a6a', '#868686'];

function hash(...n) { let h = 2166136261; for (const v of n) { h ^= (v * 977) | 0; h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }
function shade(hex, f) {
  if (hex.startsWith('rgb')) return hex;
  const n = parseInt(hex.slice(1), 16), c = v => Math.max(0, Math.min(255, Math.round(v * (1 + f))));
  return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
const FACE_F = [0.12, -0.28, -0.08]; // top, +b (front-left), +a (front-right)

function sketch(ctx, cx, cy) {
  const pt = (a, b, z) => [cx + (a - b) * W, cy + (a + b) * H - z];
  function poly(pts, fill, stroke) {
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (let k = 1; k < pts.length; k++) ctx.lineTo(...pts[k]); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  // quad given by a corner and two parametric edge functions; noise like the app's face()
  function quad(c, color, seed, id, edged, noisy = true) {
    poly([c(0, 0), c(1, 0), c(1, 1), c(0, 1)], color);
    if (noisy) for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
      const r = hash(seed, id, a, b); if (r < 0.55) continue;
      const f = r < 0.75 ? -0.06 : r < 0.9 ? 0.05 : -0.11;
      poly([c(a / 4, b / 4), c((a + 1) / 4, b / 4), c((a + 1) / 4, (b + 1) / 4), c(a / 4, (b + 1) / 4)], shade(color, f));
    }
    if (edged) poly([c(0, 0), c(1, 0), c(1, 1), c(0, 1)], null, EDGE);
  }
  /** box over a in [a0,a1], b in [b0,b1] (tile units, a tile is ±0.5), z0..z1 px. cols = base colour or [top,+b,+a]. */
  function box(a0, a1, b0, b1, z0, z1, col, seed, edged = true, noisy = true) {
    const cols = Array.isArray(col) ? col : FACE_F.map(f => shade(col, f));
    quad((u, v) => pt(a0 + (a1 - a0) * u, b1, z1 - (z1 - z0) * v), cols[1], seed, 1, edged, noisy);
    quad((u, v) => pt(a1, b1 - (b1 - b0) * u, z1 - (z1 - z0) * v), cols[2], seed, 2, edged, noisy);
    quad((u, v) => pt(a0 + (a1 - a0) * u, b0 + (b1 - b0) * v, z1), cols[0], seed, 0, edged, noisy);
    return { a0, a1, b0, b1, z0, z1 };
  }
  /** one "pixel" (col from the left as seen on screen, row from the top) on a box's +b (side 1) or +a (side 2) face, n pixels across */
  function pix(bx, side, col, row, color, n, cw = 1, rh = 1, nRows = n) {
    const f = shade(color, FACE_F[side]);
    const zt = bx.z1 - (bx.z1 - bx.z0) * (row / nRows), zb = bx.z1 - (bx.z1 - bx.z0) * ((row + rh) / nRows);
    const u0 = col / n, u1 = (col + cw) / n;
    const p = side === 1
      ? (u, z) => pt(bx.a0 + (bx.a1 - bx.a0) * u, bx.b1, z)
      : (u, z) => pt(bx.a1, bx.b1 - (bx.b1 - bx.b0) * u, z);
    poly([p(u0, zt), p(u1, zt), p(u1, zb), p(u0, zb)], f);
  }
  return { pt, poly, box, pix };
}

/**
 * dir: 0 east (+a), 1 north (-b), 2 west (-a), 3 south (+b). Karel stands on tile centre (0,0) at z=0.
 * v = variant palette.
 */
function karel(S, dir, v) {
  const f = [[1, 0], [0, -1], [-1, 0], [0, 1]][dir]; // forward
  const alongA = f[0] !== 0;
  // box centred at (fwd, side) offsets (in units) with half extents hf (forward) hs (side), z0..z1 units
  const part = (fwd, side, hf, hs, z0, z1, col, seed, noisy = true) => {
    const ca = alongA ? fwd * f[0] : side, cb = alongA ? side : fwd * f[1];
    const ha = alongA ? hf : hs, hb = alongA ? hs : hf;
    return S.box((ca - ha) * U / W, (ca + ha) * U / W, (cb - hb) * U / W, (cb + hb) * U / W, z0 * U, z1 * U, col, seed, true, noisy);
  };
  // which screen face is the front (1 = +b, 2 = +a), back, or a side
  const front = dir === 3 ? 1 : dir === 0 ? 2 : 0;
  const back = dir === 1 ? 1 : dir === 2 ? 2 : 0;
  const sides = [1, 2].filter(s => s !== front && s !== back);

  // painter's order: far arm, legs, torso, head, near arm. Near = side offset pointing toward +a+b.
  const sideDir = alongA ? [0, 1] : [1, 0]; // world axis of "side"
  const nearSign = 1; // +side is toward the viewer for both axes
  const arm = sign => {
    const bx = part(0, sign * 6, 2, 2, 12, 24, v.arm, 7 + sign);
    if (v.sleeve) for (const s of [1, 2]) for (let r = 0; r < v.sleeveRows; r++) for (let c = 0; c < 4; c++) S.pix(bx, s, c, r, v.sleeve, 4);
    if (v.hand) for (const s of [1, 2]) for (let c = 0; c < 4; c++) S.pix(bx, s, c, 3, v.hand, 4);
  };
  arm(-nearSign);
  for (const sign of [-1, 1]) {
    const leg = part(0, sign * 2, 2, 2, 0, 12, v.trousers, 11 + sign);
    for (const s of [1, 2]) for (let c = 0; c < 4; c++) S.pix(leg, s, c, 11, v.shoe, 4, 1, 1, 12);
  }
  const torso = part(0, 0, 2, 4, 12, 24, v.shirt, 21);
  if (front && v.chest) for (let c = 1; c < 7; c++) S.pix(torso, front, c, 3, v.chest, 8, 1, 5, 12);
  if (v.belt) for (const s of [1, 2]) for (let c = 0; c < 8; c++) S.pix(torso, s, c, 11, v.belt, 8, 1, 1, 12);
  const head = part(0, 0, 4, 4, 24, 32, v.skin, 31);
  // hair / helmet: top face was drawn in skin; repaint the top
  if (v.hair) {
    S.box(head.a0, head.a1, head.b0, head.b1, head.z1 - 0.01, head.z1, [shade(v.hair, 0.12), 'transparent', 'transparent'], 31, false, false);
    for (const s of [1, 2]) {
      const rows = s === back ? 8 : s === front ? 2 : 3;
      for (let r = 0; r < rows; r++) for (let c = 0; c < 8; c++) S.pix(head, s, c, r, v.hair, 8);
      if (s !== back && s !== front) for (let r = 3; r < 5; r++) S.pix(head, s, s === 1 ? 0 : 7, r, v.hair, 8); // sideburn at the back edge
    }
  }
  if (v.visor) for (const s of [1, 2]) if (s !== back) for (let c = 0; c < 8; c++) S.pix(head, s, c, 3, v.visor, 8, 1, 2);
  if (front) v.face(S, head, front);
  arm(nearSign);
}

const VARIANTS = [
  {
    title: 'A · Steve tvar, Karel farby', sub: 'koža, hnedé vlasy, tričko v brandovej červenej, nohavice v ink modrej',
    skin: '#d9a56e', hair: '#3b2b1a', shirt: '#e8562a', arm: '#d9a56e', sleeve: '#e8562a', sleeveRows: 1, hand: null,
    trousers: '#2e4a78', shoe: '#3a3f44', belt: null, chest: null, visor: null,
    face(S, h, s) {
      S.pix(h, s, 1, 4, '#ffffff', 8); S.pix(h, s, 2, 4, '#17212b', 8); S.pix(h, s, 5, 4, '#17212b', 8); S.pix(h, s, 6, 4, '#ffffff', 8);
      S.pix(h, s, 3, 5, '#b8824f', 8, 2, 1); S.pix(h, s, 2, 6, '#5a3a25', 8, 4, 1);
    },
  },
  {
    title: 'B · verný Steve', sub: 'tyrkysové tričko, fialové nohavice, modré oči (chránená postava Mojangu)',
    skin: '#c69c6d', hair: '#3b2b1a', shirt: '#14a89a', arm: '#c69c6d', sleeve: '#14a89a', sleeveRows: 1, hand: null,
    trousers: '#5b3fbf', shoe: '#6b6b6b', belt: null, chest: null, visor: null,
    face(S, h, s) {
      S.pix(h, s, 1, 4, '#ffffff', 8); S.pix(h, s, 2, 4, '#3f5fc7', 8); S.pix(h, s, 5, 4, '#3f5fc7', 8); S.pix(h, s, 6, 4, '#ffffff', 8);
      S.pix(h, s, 3, 5, '#9c6b45', 8, 2, 1); S.pix(h, s, 2, 6, '#5a3a25', 8, 4, 1); S.pix(h, s, 3, 7, '#5a3a25', 8, 2, 1);
    },
  },
  {
    title: 'C · robot v Steve proporciách', sub: 'dnešná oceľ, vizor a červené oči, ale ľudská silueta: hlava, trup, ruky, nohy',
    skin: '#a3adb5', hair: null, shirt: '#a3adb5', arm: '#a3adb5', sleeve: null, sleeveRows: 0, hand: '#2b2b2b',
    trousers: '#7f8b94', shoe: '#2b2b2b', belt: '#3b444a', chest: '#e8562a', visor: '#17212b',
    face(S, h, s) { S.pix(h, s, 1, 3, '#ff3b1f', 8, 2, 2); S.pix(h, s, 5, 3, '#ff3b1f', 8, 2, 2); },
  },
];

const root = document.getElementById('root');
root.insertAdjacentHTML('beforeend', '<div class="hd"></div>' + ['východ', 'juh', 'sever', 'západ'].map(n => `<div class="hd">${n}</div>`).join(''));
for (const v of VARIANTS) {
  root.insertAdjacentHTML('beforeend', `<div class="lbl">${v.title}<small>${v.sub}</small></div>`);
  for (const dir of [0, 3, 1, 2]) {
    const c = document.createElement('canvas'); c.width = 190 * 3; c.height = 118 * 3;
    const cell = document.createElement('div'); cell.appendChild(c); root.appendChild(cell);
    const ctx = c.getContext('2d'); ctx.setTransform(3, 0, 0, 3, 0, 0);
    const ox = 95, oy = 36;
    const tile = (i, j) => [ox + (i - j) * W, oy + (i + j) * H];
    // 2x2 floor, two bricks on (1,0), Karel on (0,1)
    for (const [i, j] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
      const [cx, cy] = tile(i, j); const S = sketch(ctx, cx, cy);
      S.box(-0.5, 0.5, -0.5, 0.5, -FZ, 0, FLOOR, i * 7 + j);
      if (i === 1 && j === 0) for (let k = 0; k < 2; k++) S.box(-0.46, 0.46, -0.46, 0.46, k * BZ, (k + 1) * BZ, BRICK, 40 + k);
      if (i === 0 && j === 1) karel(S, dir, v);
    }
  }
}
</script>
