<!doctype html><meta charset="utf-8"><title>Karel sprite</title>
<style>body{font:14px system-ui;background:#cfe6f5;margin:20px}.row{display:flex;gap:24px}.col{background:#e9f3fa;padding:8px;border:1px solid #9bb}h3{margin:0 0 6px;font-weight:600}canvas{width:190px;height:150px;display:block;zoom:2.7}</style>
<div class="row" id="root"></div>
<script type="module">
import { renderWorld } from '/src/ui/render.ts';
import { emptyWorld } from '/src/core/world.ts';
Object.defineProperty(window, 'devicePixelRatio', { value: 3 });
const root = document.getElementById('root');
for (const [dir, name] of [[0,'východ'],[3,'juh'],[1,'sever'],[2,'západ']]) {
  const col = document.createElement('div'); col.className='col';
  col.innerHTML = `<h3>${name}</h3>`;
  root.appendChild(col);
  for (const mark of [false, true]) {
    const w = emptyWorld(2, 2);
    w.karel = { x: 0, y: 1, dir };
    w.tiles[1].bricks = 2; w.tiles[2].mark = mark;
    const c = document.createElement('canvas'); col.appendChild(c);
    renderWorld(c, w, 0, undefined, { levels: 3 });
  }
}
</script>
